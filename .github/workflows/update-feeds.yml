name: Update feeds

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}                     # optional
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # for the attack map
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                       # for phone alerts
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}           # Threats tab: malware activity
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}                     # Threats tab: campaign reports
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}   # Incidents tab: gang profiles
        run: python scripts/fetch_feeds.py

      - name: Commit if alerts, news or map data changed
        run: |
          if [ -z "$(git status --porcelain -- docs/data/alerts.json docs/data/news.json docs/data/attacks.json docs/data/ransomware.json docs/data/breaches.json docs/data/threats.json docs/data/gangs.json cache/notified.json cache/digest.json docs/data/meta.json)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data cache
          git commit -m "Update feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
